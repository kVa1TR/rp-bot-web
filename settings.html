<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RP Bot - Config</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0a0a0a; --panel-bg: #141414; --border-color: #2a2a2a;
            --text-main: #ededed; --text-muted: #888888; --accent-green: #4ade80;
            --accent-orange: #f97316;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; user-select: none; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 16px; padding-bottom: 130px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .logo-area { display: flex; align-items: center; gap: 12px; }
        .logo-icon { width: 32px; height: 32px; background: #fff; color: #000; display: flex; align-items: center; justify-content: center; border-radius: 6px; font-weight: 700; font-size: 18px; }
        .logo-text { font-weight: 600; font-size: 18px; }
        .logo-sub { font-size: 10px; color: var(--text-muted); font-family: 'JetBrains Mono', monospace; margin-left: 5px; }
        .status-badge { font-family: 'JetBrains Mono', monospace; font-size: 12px; display: flex; align-items: center; gap: 6px; border: 1px solid var(--border-color); padding: 4px 10px; border-radius: 6px; }
        .status-dot { width: 6px; height: 6px; background: var(--accent-green); border-radius: 50%; box-shadow: 0 0 8px var(--accent-green); }
        
        h1 { font-size: 28px; font-weight: 600; margin-bottom: 4px; }
        .subtitle { color: var(--text-muted); font-size: 13px; margin-bottom: 24px; }

        .panel { background-color: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 12px; overflow: hidden; margin-bottom: 16px; }
        .panel-header { padding: 12px 16px; font-weight: 600; font-size: 14px; border-bottom: 1px solid var(--border-color); background: rgba(255,255,255,0.02); }
        .panel-content { padding: 16px; display: flex; flex-direction: column; gap: 16px; }
        
        .row { display: flex; justify-content: space-between; align-items: center; }
        .row-label { font-size: 14px; font-weight: 500; }
        .row-desc { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
        
        input[type="text"] { background: #0a0a0a; border: 1px solid var(--border-color); color: #fff; padding: 10px 12px; border-radius: 6px; font-family: 'JetBrains Mono', monospace; font-size: 14px; width: 100%; outline: none; }
        
        .segment-group { display: flex; background: #0a0a0a; border: 1px solid var(--border-color); border-radius: 6px; padding: 2px; gap: 2px; }
        .segment-btn { flex: 1; text-align: center; padding: 8px 12px; font-size: 13px; font-weight: 500; color: var(--text-muted); border-radius: 4px; cursor: pointer; }
        .segment-btn.active { background: #fff; color: #000; font-weight: 600; }
        
        .toggle { position: relative; width: 44px; height: 24px; background: #0a0a0a; border: 1px solid var(--border-color); border-radius: 12px; cursor: pointer; transition: 0.3s; }
        .toggle::after { content: ''; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; background: #666; border-radius: 50%; transition: 0.3s; }
        .toggle.active { background: rgba(74, 222, 128, 0.1); border-color: var(--accent-green); }
        .toggle.active::after { transform: translateX(20px); background: var(--accent-green); box-shadow: 0 0 8px rgba(74, 222, 128, 0.5); }

        /* Списки (Стрики, Связи, Логи) */
        .list-item { background: #0a0a0a; border: 1px solid var(--border-color); padding: 12px; border-radius: 8px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        .list-item-info { font-size: 14px; font-weight: 500; }
        .list-item-sub { font-size: 11px; color: var(--text-muted); font-family: 'JetBrains Mono', monospace; }
        
        .streak-badge { background: rgba(249, 115, 22, 0.15); color: var(--accent-orange); padding: 4px 10px; border-radius: 12px; font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 4px; }
        
        /* Кнопка "Применить" */
        .save-btn { width: 100%; background: #fff; color: #000; border: none; padding: 14px; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 10px; }
        .save-btn:active { transform: scale(0.98); background: #ccc; }

        /* Островок */
        .bottom-nav { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(20, 20, 20, 0.85); backdrop-filter: blur(16px); border: 1px solid var(--border-color); border-radius: 30px; display: flex; justify-content: space-around; padding: 8px 8px; width: 95%; max-width: 400px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); z-index: 100; }
        .nav-btn { background: transparent; border: none; color: var(--text-muted); font-size: 10px; font-weight: 500; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; transition: 0.2s; padding: 8px 10px; border-radius: 20px; }
        .nav-btn svg { width: 18px; height: 18px; fill: currentColor; }
        .nav-btn.active { color: var(--accent-green); background: rgba(74, 222, 128, 0.1); }
        .nav-btn.streak.active { color: var(--accent-orange); background: rgba(249, 115, 22, 0.1); }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo-area">
            <div class="logo-icon">R</div>
            <div><span class="logo-text">RP BOT</span><span class="logo-sub">CONFIG</span></div>
        </div>
        <div class="status-badge"><div class="status-dot"></div><span>ONLINE</span></div>
    </div>

    <!-- 1. НАСТРОЙКИ -->
    <div id="page-settings">
        <h1>Настройки</h1>
        <div class="subtitle">Управление профилем</div>
        <div class="panel">
            <div class="panel-header">Профиль</div>
            <div class="panel-content">
                <div><div class="row-label">Имя (Ник)</div><input type="text" id="nickname" placeholder="Введите ник..." autocomplete="off"></div>
                <div class="row" style="margin-top: 8px;"><div><div class="row-label">Пол</div></div></div>
                <div class="segment-group">
                    <div class="segment-btn" id="gender-male" onclick="setGender('male')">Мужской</div>
                    <div class="segment-btn" id="gender-female" onclick="setGender('female')">Женский</div>
                </div>
            </div>
        </div>
        <div class="panel">
            <div class="panel-header">Модули</div>
            <div class="panel-content">
                <div class="row"><div><div class="row-label">Instant Mode</div><div class="row-desc">Без подтверждения</div></div><div class="toggle" id="toggle-instant" onclick="toggleInstant()"></div></div>
                <div class="row"><div><div class="row-label">Beta Test</div><div class="row-desc">Действия на себя</div></div><div class="toggle" id="toggle-beta" onclick="toggleBeta()"></div></div>
                <div class="row"><div><div class="row-label">Smart Emoji</div><div class="row-desc">Умные смайлики</div></div><div class="toggle" id="toggle-emoji" onclick="toggleEmoji()"></div></div>
            </div>
        </div>
        <button class="save-btn" onclick="saveSettings()">Применить</button>
    </div>

    <!-- 2. СТРИКИ -->
    <div id="page-streaks" style="display: none;">
        <h1>Стрики</h1>
        <div class="subtitle">Твой огонек с напарниками (ЛС)</div>
        <div id="streaks-list"></div>
    </div>

    <!-- 3. СВЯЗИ (Шансы) -->
    <div id="page-links" style="display: none;">
        <h1>Связи</h1>
        <div class="subtitle">Настроенные шансы провала</div>
        <div id="links-list"></div>
    </div>

    <!-- 4. ЛОГИ -->
    <div id="page-logs" style="display: none;">
        <h1>Логи</h1>
        <div class="subtitle">История действий</div>
        <div id="logs-list"></div>
    </div>

    <!-- ОСТРОВОК -->
    <div class="bottom-nav">
        <button class="nav-btn active" id="nav-settings" onclick="switchTab('settings')">
            <svg viewBox="0 0 24 24"><path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.06-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.73,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.06,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.44-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.49-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/></svg>
            Настройки
        </button>
        <button class="nav-btn streak" id="nav-streaks" onclick="switchTab('streaks')">
            <svg viewBox="0 0 24 24"><path d="M12,23c-4.97,0-9-4.03-9-9c0-2.12,0.74-4.06,1.97-5.61C6.27,6.86,7.22,5.4,8.5,4.5 c1.12-0.79,1.75-2.13,1.98-2.86c0.05-0.17,0.21-0.29,0.39-0.29c0.18,0,0.34,0.12,0.39,0.29c0.23,0.72,0.86,2.07,1.98,2.86 c1.28,0.9,2.23,2.36,3.53,3.89C18.26,9.94,19,11.88,19,14C19,18.97,16.97,23,12,23z M12,19c2.21,0,4-1.79,4-4 c0-1.55-0.94-3.12-2.09-4.47c-0.67-0.79-1.44-1.55-1.91-2.35c-0.47,0.8-1.24,1.56-1.91,2.35C8.94,11.88,8,13.45,8,15 C8,17.21,9.79,19,12,19z"/></svg>
            Стрики
        </button>
        <button class="nav-btn" id="nav-links" onclick="switchTab('links')">
            <svg viewBox="0 0 24 24"><path d="M3.9,12c0-1.71,1.39-3.1,3.1-3.1h4V7H7c-2.76,0-5,2.24-5,5s2.24,5,5,5h4v-1.9H7C5.39,15.1,3.9,13.71,3.9,12z M8,13h8v-2H8V13z M17,7h-4v1.9h4c1.71,0,3.1,1.39,3.1,3.1s-1.39,3.1-3.1,3.1h-4V17h4c2.76,0,5-2.24,5-5S19.76,7,17,7z"/></svg>
            Связи
        </button>
        <button class="nav-btn" id="nav-logs" onclick="switchTab('logs')">
            <svg viewBox="0 0 24 24"><path d="M13,3c-4.97,0-9,4.03-9,9L1,12l3.89,3.89L8.78,12H6c0-3.87,3.13-7,7-7s7,3.13,7,7s-3.13,7-7,7 c-1.93,0-3.68-0.79-4.94-2.06l-1.42,1.42C8.27,19.99,10.51,21,13,21c4.97,0,9-4.03,9-9S17.97,3,13,3z M12,8v5l4.28,2.54l0.72-1.21 l-3.5-2.08V8H12z"/></svg>
            Логи
        </button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        
        let currentGender = ""; let isInstant = false; let isBeta = false; let isEmoji = true;

        function switchTab(tab) {
            ['settings', 'streaks', 'links', 'logs'].forEach(t => {
                document.getElementById(`page-${t}`).style.display = t === tab ? 'block' : 'none';
                document.getElementById(`nav-${t}`).classList.toggle('active', t === tab);
            });
        }

        function setGender(gender) {
            currentGender = gender;
            document.getElementById('gender-male').classList.toggle('active', gender === 'male');
            document.getElementById('gender-female').classList.toggle('active', gender === 'female');
        }

        function toggleInstant() { isInstant = !isInstant; document.getElementById('toggle-instant').classList.toggle('active', isInstant); }
        function toggleBeta() { isBeta = !isBeta; document.getElementById('toggle-beta').classList.toggle('active', isBeta); }
        function toggleEmoji() { isEmoji = !isEmoji; document.getElementById('toggle-emoji').classList.toggle('active', isEmoji); }

        // Парсинг данных из URL
        const urlParams = new URLSearchParams(window.location.search);
        
        // Логи
        const logsData = urlParams.get('logs');
        if (logsData) {
            const list = JSON.parse(decodeURIComponent(logsData));
            const c = document.getElementById('logs-list'); c.innerHTML = '';
            list.slice().reverse().forEach(item => {
                c.innerHTML += `<div class="list-item"><div class="list-item-info">${item}</div></div>`;
            });
            if(list.length === 0) c.innerHTML = '<div class="list-item">Пусто.</div>';
        }

        // Стрики
        const streaksData = urlParams.get('streaks');
        if (streaksData) {
            const list = JSON.parse(decodeURIComponent(streaksData));
            const c = document.getElementById('streaks-list'); c.innerHTML = '';
            for (const [name, count] of Object.entries(list)) {
                c.innerHTML += `<div class="list-item">
                    <div><div class="list-item-info">${name}</div><div class="list-item-sub">Общение в ЛС</div></div>
                    <div class="streak-badge">🔥 ${count}</div>
                </div>`;
            }
            if(Object.keys(list).length === 0) c.innerHTML = '<div class="list-item">Нет активных стриков.</div>';
        }

        // Связи (Luck)
        const linksData = urlParams.get('links');
        if (linksData) {
            const list = JSON.parse(decodeURIComponent(linksData));
            const c = document.getElementById('links-list'); c.innerHTML = '';
            for (const [name, luck] of Object.entries(list)) {
                c.innerHTML += `<div class="list-item">
                    <div><div class="list-item-info">${name}</div><div class="list-item-sub">Шанс провала</div></div>
                    <div class="list-item-info" style="color:var(--accent-green)">${luck}%</div>
                </div>`;
            }
            if(Object.keys(list).length === 0) c.innerHTML = '<div class="list-item">Связей пока нет.</div>';
        }

        function saveSettings() {
            const data = {
                action: "save_config",
                nickname: document.getElementById('nickname').value.trim(),
                gender: currentGender, instant: isInstant, beta: isBeta, smart_emoji: isEmoji
            };
            tg.sendData(JSON.stringify(data));
            tg.close();
        }
        
        tg.setHeaderColor('#0a0a0a'); tg.setBackgroundColor('#0a0a0a');
        document.getElementById('toggle-emoji').classList.add('active');
    </script>
</body>
</html>
